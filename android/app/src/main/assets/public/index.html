<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BirgaTomosha — Yaqinlar bilan birga video ko'ring</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#6c5ce7" />
<link rel="icon" href="/icons/icon-192.png" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <button id="themeToggleBtn" class="theme-toggle" title="Tema almashtirish">🌙</button>

  <div class="container center-screen">
    <h1 class="logo">🎬 BirgaTomosha</h1>
    <p class="subtitle">Yaqinlaringiz bilan bir vaqtda video tomosha qiling, yozing va gaplashing</p>

    <div class="card">
      <label>Ismingiz</label>
      <input id="nameInput" type="text" placeholder="Ismingizni kiriting" maxlength="24" />

      <label>Xona paroli (ixtiyoriy)</label>
      <input id="createPasswordInput" type="text" placeholder="Bo'sh qoldirsangiz — ochiq xona" maxlength="20" />

      <button id="createBtn" class="btn btn-primary">Yangi xona yaratish</button>

      <div class="divider">yoki</div>

      <label>Xona kodi</label>
      <input id="roomCodeInput" type="text" placeholder="masalan: AB12CD" maxlength="6" style="text-transform:uppercase" />
      <input id="joinPasswordInput" type="text" placeholder="Parol (agar xona qulflangan bo'lsa)" maxlength="20" style="display:none" />
      <button id="joinBtn" class="btn btn-secondary">Xonaga qo'shilish</button>
    </div>

    <p id="errorMsg" class="error"></p>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="/js/common.js"></script>
  <script src="/js/telegram.js"></script>
  <script>
    const nameInput = document.getElementById("nameInput");
    const roomCodeInput = document.getElementById("roomCodeInput");
    const createPasswordInput = document.getElementById("createPasswordInput");
    const joinPasswordInput = document.getElementById("joinPasswordInput");
    const errorMsg = document.getElementById("errorMsg");

    // Ismni eslab qolish (yoki Telegramdan olish)
    const tgUser = typeof getTelegramUser === "function" ? getTelegramUser() : null;
    nameInput.value = (tgUser && tgUser.name) || localStorage.getItem("bt_name") || "";
    if (tgUser) {
      nameInput.placeholder = "Telegram ismingiz aniqlandi";
    }
    joinPasswordInput.style.display = "block"; // parol ixtiyoriy, doim ko'rsatamiz

    document.getElementById("createBtn").onclick = () => {
      const name = nameInput.value.trim() || "Mehmon";
      const password = createPasswordInput.value.trim();
      localStorage.setItem("bt_name", name);
      // Xona room.html sahifasida yaratiladi (socket shu yerda ulanadi)
      let url = `/room.html?action=create&name=${encodeURIComponent(name)}`;
      if (password) url += `&password=${encodeURIComponent(password)}`;
      window.location.href = url;
    };

    document.getElementById("joinBtn").onclick = () => {
      const name = nameInput.value.trim() || "Mehmon";
      const roomId = roomCodeInput.value.trim().toUpperCase();
      const password = joinPasswordInput.value.trim();
      if (!roomId) {
        errorMsg.textContent = "Iltimos, xona kodini kiriting";
        return;
      }
      localStorage.setItem("bt_name", name);
      let url = `/room.html?action=join&room=${roomId}&name=${encodeURIComponent(name)}`;
      if (password) url += `&password=${encodeURIComponent(password)}`;
      window.location.href = url;
    };

    // Agar avvalgi urinishda parol xato bo'lsa, shu sahifaga qaytariladi (?err=)
    const err = new URLSearchParams(window.location.search).get("err");
    if (err) errorMsg.textContent = decodeURIComponent(err);
  </script>
</body>
</html>
