<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Xona — BirgaTomosha</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#6c5ce7" />
<link rel="icon" href="/icons/icon-192.png" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="room-layout">
    <header class="room-header">
      <div class="header-left">
        <span class="room-code">Xona: <b id="roomCodeLabel">—</b> <span id="lockIcon" style="display:none">🔒</span></span>
        <button id="copyLinkBtn" class="btn-link">Havolani nusxalash</button>
      </div>
      <div id="userList" class="user-list"></div>
      <div class="header-right">
        <button id="themeToggleBtn" class="theme-toggle" title="Tema almashtirish">🌙</button>
      </div>
    </header>

    <main class="room-main">
      <section class="video-section">
        <div id="hostControls" class="host-controls" style="display:none">
          <input id="youtubeInput" type="text" placeholder="YouTube havolasini shu yerga qo'ying" />
          <button id="loadYoutubeBtn" class="btn btn-small">Hozir yuklash</button>
          <button id="addToPlaylistBtn" class="btn btn-small btn-outline">Navbatga qo'shish</button>
          <span class="or-text">yoki</span>
          <input id="fileInput" type="file" accept="video/*" />
          <span id="uploadStatus"></span>
        </div>

        <div id="playerWrap" class="player-wrap">
          <div id="youtubePlayer"></div>
          <video id="filePlayer" controls style="display:none; width:100%;"></video>
          <p id="noVideoMsg" class="no-video">Video hali tanlanmagan. Xona egasi YouTube havolasi qo'yishi yoki video yuklashi mumkin.</p>
          <div id="reactionLayer" class="reaction-layer"></div>
          <button id="fullscreenBtn" class="fullscreen-btn" title="To'liq ekran">⛶</button>
        </div>

        <div class="reaction-bar">
          <button class="reaction-btn" data-emoji="❤️">❤️</button>
          <button class="reaction-btn" data-emoji="😂">😂</button>
          <button class="reaction-btn" data-emoji="😮">😮</button>
          <button class="reaction-btn" data-emoji="👏">👏</button>
          <button class="reaction-btn" data-emoji="🔥">🔥</button>
          <button class="reaction-btn" data-emoji="👍">👍</button>
        </div>

        <div id="playlistPanel" class="playlist-panel">
          <div class="playlist-header">
            <span>📋 Navbat</span>
            <button id="nextVideoBtn" class="btn btn-small" style="display:none">Keyingisi ▶</button>
          </div>
          <div id="playlistItems" class="playlist-items"></div>
        </div>
      </section>

      <aside class="side-panel">
        <div class="voice-panel">
          <button id="voiceToggleBtn" class="btn btn-secondary">🎙️ Ovozli suhbatga qo'shilish</button>
          <div id="voiceStatus" class="voice-status"></div>
        </div>

        <div class="chat-panel">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input id="chatInput" type="text" placeholder="Xabar yozing..." maxlength="500" />
            <button id="sendChatBtn" class="btn btn-small">Yuborish</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/telegram.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
