name: Android APK build

# Har safar main branchga push qilinganda yoki qo'lda ishga tushirilganda APK yasaydi
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java (JDK 17) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: npm paketlarini o'rnatish
        run: npm install

      - name: Android platformasini qo'shish (birinchi marta)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor'ni sinxronlash
        run: npx cap sync android

      - name: APK yasash (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'ni saqlash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: birgatomosha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
